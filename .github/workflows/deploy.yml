name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npx vite build --base=/El-Fin-de-los-Ni-os---web/
      - name: Verify Pages output
        run: |
          test -s ./dist/public/index.html
          test -s ./dist/public/404.html
          test -s ./dist/public/data/cuencas.geojson
          test -s ./dist/public/data/variables.json
          test -s ./dist/public/data/nasa_power_anual.csv
          test -s ./dist/public/data/trend_results.csv
          test -s ./dist/public/data/robustez_estadistica.json
          test -s ./dist/public/data/robustez_estadistica.csv
          test -s ./dist/public/data/oni_ascii_cpc_1998_2026.txt
          test -s ./dist/public/data/oni_cpc_fuente.json
          test -s ./dist/public/data/estacion_cordoba_observatorio_mensual.csv
          test -s ./dist/public/data/validacion_local_cordoba.csv
          test -s ./dist/public/data/validacion_estacion_cordoba.json
          test -s ./dist/public/data/enso_atribucion.json
          test -s ./dist/public/data/enso_atribucion.csv
          test -s ./dist/public/data/enso_fases_anuales.csv
          test -s ./dist/public/data/enso_mensual_estacion.json
          test -s ./dist/public/data/escenarios_enso_3_6_meses.json
          test -s ./dist/public/data/inventario_cuencas.json
          test -s ./dist/public/data/captura_cuencas_general.png
          test -s ./dist/public/data/captura_cuenca1.png
          test -s ./dist/public/data/captura_simulacion_cuenca1_real.png
          test -s ./dist/public/simulacion-2d/index.html
          test -s ./dist/public/simulacion-2d/data/data.js
          test -s ./dist/public/simulacion-2d/data/contorno_cuenca.json
          test -s ./dist/public/simulacion-2d/data/mapa_cuenca_real.png
          test -s ./dist/public/simulacion-2d/vendor/leaflet.js
          test -s ./dist/public/simulacion-2d/vendor/chart.umd.min.js
          test -s ./dist/public/panel/PaneldeControlV3.html
          test -s ./dist/public/drone/index.html
          test -s ./dist/public/neun/index.html
          test -s ./dist/public/neun/simulador.html
          test -s ./dist/public/neun/neun_model.bin
          # La demo es lo que mas se muestra del proyecto: si se rompe en el
          # build, el deploy no debe pasar en verde.
          test -s ./dist/public/demo/index.html
          test -s ./dist/public/demo/atlas.json
          test -s ./dist/public/demo/cuencas_reales.json
          test -s ./dist/public/demo/terreno/relieve.png
          test -s ./dist/public/demo/terreno/pendiente.png
          test -s ./dist/public/demo/terreno/orientacion.png
          test -s ./dist/public/demo/terreno/llenado.gif
      # IMPORTANTE: en Settings → Pages → Build and deployment, "Source" debe
      # estar en "GitHub Actions". Si queda en "Deploy from a branch / main /",
      # GitHub sirve el index.html de desarrollo con /src/main.tsx y la app no
      # arranca, aunque este workflow termine OK.
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./dist/public"
          name: github-pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
